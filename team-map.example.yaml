# Example eng-pulse team map. Copy to team-map.yaml (git-ignored) and replace
# every value. UUIDs below are placeholders of valid shape.
eng_pulse_version: 1
company: Acme
timezone: Asia/Kolkata
working_days: [Mon, Tue, Wed, Thu, Fri]
